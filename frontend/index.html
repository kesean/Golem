<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Support AI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Prevent flash of unstyled/wrong content while Clerk resolves -->
  <style>body { visibility: hidden; background: #0e1825; }</style>
</head>
<body>

  <!-- Auth wall: shown until user signs in -->
  <!-- Visually hidden utility used by screen-reader labels -->
  <style>
    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>

  <div id="auth-wall" class="auth-wall">
    <div class="auth-card">
      <h1>Dev Support AI</h1>
      <p class="subtitle">Sign in to get developer support–style answers.</p>
    </div>
  </div>

  <!-- App root: hidden until authenticated (inline style avoids FOUC before CSS loads) -->
  <div id="app-root" style="display:none">
    <div class="container">

      <aside class="history-sidebar" id="history-sidebar" aria-label="Conversation history">
        <div class="history-header">
          <span class="history-title">History</span>
          <button class="clear-btn" onclick="clearHistory()">Clear</button>
        </div>
        <div class="history-search">
          <label for="history-search" class="visually-hidden">Search history</label>
          <input type="text" id="history-search" placeholder="Search…" oninput="window._filterHistory()" />
        </div>
        <ul class="history-list" id="history-list"></ul>
      </aside>

      <div class="main-content">
        <header>
          <div class="header-row">
            <div>
              <h1>Dev Support AI</h1>
              <p class="subtitle">Ask a technical question and get a developer support–style answer.</p>
            </div>
            <div class="header-actions">
              <button onclick="newConversation()" class="sign-out-btn">New conversation</button>
              <button id="sign-out-btn" class="sign-out-btn">Sign out</button>
            </div>
          </div>
        </header>

        <main>
          <div class="input-area">
            <label for="question" class="visually-hidden">Technical question</label>
            <textarea
              id="question"
              placeholder="e.g. Why am I getting a 401 error when calling the API with my key?"
              rows="4"
            ></textarea>
            <div class="input-actions">
              <span id="shortcut-hint" class="shortcut-hint"></span>
              <button id="ask-btn" onclick="askQuestion()">Ask</button>
            </div>
          </div>

          <div id="skeleton" class="skeleton-area hidden" role="status" aria-label="Loading response">
            <div class="skeleton-line" style="width:30%;margin-bottom:1rem"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line" style="width:80%"></div>
            <div class="skeleton-line" style="width:60%;margin-bottom:1rem"></div>
            <div class="skeleton-line" style="width:35%;margin-bottom:0.5rem"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line" style="width:75%"></div>
            <div class="skeleton-line" style="width:50%"></div>
          </div>

          <div id="response-area" class="response-area hidden">
            <div class="response-header">
              <span id="product-tag-badge" class="product-tag hidden"></span>
              <div class="response-actions">
                <button id="share-btn" class="copy-btn" onclick="shareResponse()">Share</button>
                <button id="copy-btn" class="copy-btn" onclick="copyResponse()">Copy</button>
                <button id="thumb-up-btn" class="feedback-btn" onclick="thumbFeedback('up')" disabled aria-label="Helpful">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
                    <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                  </svg>
                </button>
                <button id="thumb-down-btn" class="feedback-btn" onclick="thumbFeedback('down')" disabled aria-label="Not helpful">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/>
                    <path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="section">
              <h2 class="section-label">Summary</h2>
              <div id="summary" class="section-body"></div>
            </div>
            <div class="section">
              <h2 class="section-label">Root Cause</h2>
              <div id="root-cause" class="section-body"></div>
            </div>
            <div class="section">
              <h2 class="section-label">Debug Steps</h2>
              <ol id="debug-steps" class="section-body steps-list"></ol>
            </div>
            <div class="section" id="docs-section">
              <h2 class="section-label">Docs</h2>
              <ul id="docs" class="section-body docs-list"></ul>
            </div>
          </div>

          <div id="error-area" class="error-area hidden" role="alert">
            <span id="error-message"></span>
          </div>
        </main>
      </div>

    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
