<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F6E56"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E1F5EE"/>
      <stop offset="100%" stop-color="#9FE1CB"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Chat bubble body -->
  <rect x="14" y="16" width="72" height="50" rx="9" fill="url(#bubble)"/>

  <!-- Bubble tail -->
  <polygon points="21,66 14,80 36,66" fill="url(#bubble)"/>

  <!-- Terminal prompt ">" -->
  <text x="24" y="48" font-family="monospace" font-size="18" font-weight="700" fill="#0F6E56">&gt;</text>

  <!-- Blinking cursor -->
  <rect x="44" y="32" width="9" height="16" rx="2" fill="#1D9E75" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.1;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Code line hints -->
  <rect x="24" y="56" width="18" height="4" rx="2" fill="#5DCAA5" opacity="0.7"/>
  <rect x="46" y="56" width="28" height="4" rx="2" fill="#5DCAA5" opacity="0.45"/>
</svg>
