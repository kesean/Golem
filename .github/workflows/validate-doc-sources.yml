name: Validate doc sources

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9am UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "retrieval.py"
      - "requirements.txt"
      - ".github/workflows/validate-doc-sources.yml"

jobs:
  validate:
    name: Check source file paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source paths
        run: python scripts/embed_docs.py --validate-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
