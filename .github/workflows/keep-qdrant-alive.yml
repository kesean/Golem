name: Keep Qdrant Alive

on:
  schedule:
    - cron: "0 12 * * 1" # Every Monday at 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    name: Ping Qdrant cluster
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          response=$(curl -sf \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}" \
            "${{ secrets.QDRANT_URL }}/healthz")
          echo "Response: $response"
