name: Keep Qdrant Alive

on:
  schedule:
    - cron: "0 12 * * *" # Every day at 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    name: Ping Qdrant cluster
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}" \
            "${{ secrets.QDRANT_URL }}/healthz")
          echo "HTTP $status: $(cat response.txt)"
          if [ "$status" -ge 400 ]; then
            echo "::error::Qdrant health check failed with HTTP $status (401/403 = bad API key, 404 = wrong URL or deleted cluster, 5xx = cluster down)"
            exit 1
          fi
